name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on:
      group: m7b-squid
      labels: m7b-squid
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          cache_key_prefix: mise-ci-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}

      - name: Cache Go and lint artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}-go-${{ hashFiles('src/go.mod', 'src/go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}-go-

      - name: Format check
        run: mise run fmt-check

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test
